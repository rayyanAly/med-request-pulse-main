<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <!-- Mobile viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Login | Partnership Panel</title>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/components/normalize.min.css" />
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/responsive.css">

    <!-- Javascript -->
    <script src="js/components/jquery-3.4.1.min.js"></script>
    <script src="js/main.js"></script>

</head>

<body>

    <div class="login-view">

        <h1>Welcome! <br> Login to access partnership panel</h1>

        <div class="login-form">

            <form action="#">
                <div class="input-control">
                    <span class="ico ico-lock"></span>
                    <input type="text" name="user" class="input-field" placeholder="username">
                </div>
                <div class="input-control">
                    <span class="ico ico-user"></span>
                    <input type="password" name="user" class="input-field" placeholder="password">
                </div>
                <input type="button" value="login" class="btn-login"  onclick="window.location = 'orders.html'">
                <a href="#">forgot your password?</a>
            </form>

        </div> <!-- Login Form -->

    </div> <!-- Login View -->

</body>

</html>
